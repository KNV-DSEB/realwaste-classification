project:
  name: realwaste_classification
  seed: 42
  image_size: 224

data:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  class_weighting: "none"  # D009: unweighted cross-entropy for all core models
  num_workers: 2           # Colab exposes 2 vCPUs
  pin_memory: true
  normalization:           # D008: ImageNet statistics for every model (fixed constants, nothing fitted on data)
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  augmentation:            # D011: training split only; identical for E1-E3, disabled for E4
    random_resized_crop_scale: [0.8, 1.0]
    horizontal_flip_p: 0.5
    rotation_degrees: 10
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.0

split:                     # D015/D016: frozen grouped split; src/dataset.py refuses to run if these differ
  split_sha256: "65dc85e83acee56f5db0a0f3b9b5f08c84cf71d3d35c76f69c5213d4a33b3d3d"
  class_mapping_sha256: "a99922d406b2a308ff6e85e0015dc675ad24be07f7e481ff4f0a1ed65a8aed8d"
  num_classes: 9
  block_size: 10           # D015: grouped split, blocks of 10 consecutive file numbers per class
  expected_counts:
    train: 3326
    val: 719
    test: 707

training:
  batch_size: 32
  epochs_simple: 40        # D019: same cap as E2 (was 30)
  epochs_complex: 40
  epochs_transfer_head: 10
  epochs_finetune: 15
  selection_metric: val_macro_f1         # D010: checkpoint selection
  early_stopping_monitor: val_macro_f1   # D010
  early_stopping_mode: max
  early_stopping_patience: 5

experiments:               # per-model settings that may differ (EXPERIMENT_PROTOCOL); shared rules stay in `training`
  E1:                      # D018, D019; max epochs = training.epochs_simple
    model_name: SimpleCNN
    dropout: 0.3
    optimizer: adamw
    lr: 0.001
    weight_decay: 0.0001
    scheduler: reduce_on_plateau   # on validation macro F1
    scheduler_factor: 0.5
    scheduler_patience: 2
    amp: true              # mixed precision on GPU only

evaluation:
  primary_metrics:
    - accuracy
    - macro_precision
    - macro_recall
    - macro_f1
  save_predictions: true
  save_confusion_matrix: true

paths:
  # Where the shared "Deep Learning - RealWaste" folder is mounted in this runtime.
  # Change only this line if your mount path differs.
  drive_root: "/content/drive/MyDrive/Deep Learning - RealWaste"
  dataset_dir: "01_Dataset/RealWaste"
  # Optional absolute path to a local copy of the dataset (e.g. /content/RealWaste) for faster I/O.
  dataset_root_override: null
  split_file: "02_Splits/split_grouped_v2.csv"   # D016 (D007 image-level split.csv kept as record)
  class_mapping_file: "02_Splits/class_mapping.csv"
  checkpoint_dir: "03_Checkpoints"
  result_dir: "04_Results"
  audit_dir: "04_Results/dataset_audit"
  # Root under which split.csv `filepath` values were recorded at split time (D007). Never change.
  recorded_dataset_root: "/content/drive/MyDrive/Deep Learning - RealWaste/01_Dataset/RealWaste"
